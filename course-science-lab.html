<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暑假科學班｜昇達3號數理補習班</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="overrides.css"><link rel="stylesheet" href="science-gallery.css"></head><body class="science-gallery-page"><main><a class="course-back" href="javascript:history.back()">← 回上一頁</a><section class="science-hero"><div><p class="eyebrow">SUMMER SCIENCE LAB</p><h1>暑假科學班</h1><p class="science-lead">從親手操作與生活現象出發，讓孩子在觀察、提問與驗證中，將科學原理化為看得見、說得出的理解。</p><ul><li>暑假限定：每次 2 小時，共計 4 堂。</li><li>針對化學與物理，設計不同的科學主題。</li><li>透過觀察、提問與推理，培養對科學的好奇與理解力。</li></ul><a class="button button-primary" href="https://line.me/R/ti/p/%40141yuvfn" target="_blank" rel="noopener">LINE 課程諮詢 <span>↗</span></a></div><img src="assets/junior-science-summer-teen-realistic.png" alt="兩位 14 至 15 歲學生戴著護目鏡進行科學實驗的真人感教室照片"></section><section class="science-gallery-section"><div class="science-gallery-heading"><p class="eyebrow">CLASS MOMENTS</p><h2>暑假科學班活動花絮</h2><p>左右滑動瀏覽照片；點選任一張圖片可放大查看。</p></div><div class="science-scroller" aria-label="暑假科學班照片集"><button type="button" class="science-photo"><img src="assets/science-summer/science-08.jpg" alt="2026 暑假科學班藍藍消防隊立體翻模活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-09.jpg" alt="2026 暑假科學班會動的樂譜手作活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-10.jpg" alt="2026 暑假科學班等離子槍與橡皮筋竹槍活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-11.jpg" alt="2026 暑假科學班美麗新世界螢光實驗花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-12.jpg" alt="2025 暑假科學班乾冰科學課活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-01.jpg" alt="馬格尼斯之力科學實驗活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-02.jpg" alt="簡易投影與光學實驗活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-03.jpg" alt="精靈的首飾化學實驗活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-04.jpg" alt="自然實驗與波西傑克森之火活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-05.jpg" alt="隱形的咆哮電風扇實驗活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-06.jpg" alt="電鏽刻耐蝕刻化學實驗活動花絮"></button><button type="button" class="science-photo"><img src="assets/science-summer/science-07.jpg" alt="冷冰凝愛雨夢翠霜氣象實驗活動花絮"></button></div></section></main><dialog class="science-lightbox" aria-label="放大照片"><button type="button" class="lightbox-close" aria-label="關閉放大照片">×</button><img src="" alt=""><p>點選圖片外側或按 × 關閉</p></dialog><script>const lightbox=document.querySelector('.science-lightbox'),lightboxImage=lightbox.querySelector('img');document.querySelectorAll('.science-photo img').forEach(image=>image.parentElement.addEventListener('click',()=>{lightboxImage.src=image.src;lightboxImage.alt=image.alt;lightbox.showModal()}));lightbox.addEventListener('click',event=>{if(event.target===lightbox)lightbox.close()});lightbox.querySelector('.lightbox-close').addEventListener('click',()=>lightbox.close());</script></body></html>
